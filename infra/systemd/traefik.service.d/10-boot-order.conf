# EX73: order the edge router AFTER its own dns-wait dependencies, and allow the
# pre-stage worst case (4 hosts x 60s = 240s) to complete inside the start timeout.
[Unit]
Wants=gitea.service grafana.service n8n.service woodpecker-server.service
After=gitea.service grafana.service n8n.service woodpecker-server.service

[Service]
TimeoutStartSec=420
